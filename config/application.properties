# SheetCell Application Configuration
# ===================================

# Server Configuration
server.host=localhost
server.port=8080
server.context.path=/sheetcell

# Client Configuration
client.server.url=http://localhost:8080/sheetcell
client.connection.timeout=5000
client.read.timeout=10000

# Application Settings
app.max.sheets.per.user=10
app.max.concurrent.users=100
app.session.timeout=30

# File Upload Settings
upload.max.file.size=10MB
upload.allowed.extensions=xml

# Logging Configuration
logging.level=INFO
logging.file.path=logs/sheetcell.log
logging.max.file.size=10MB
logging.max.files=5 